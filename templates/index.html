<!DOCTYPE html>
<html>
<head>
    <title>AI Student Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
        }

        .header {
            background: #1565c0;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 25px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #1565c0;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #1565c0;
            color: white;
            border: none;
            cursor: pointer;
        }

        .student {
            background: #e3f2fd;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>📚 AI Student Attendance</h1>
    <p>Student Attendance Management System</p>
</div>

<div class="container">

    <div class="card">
        <h2>Mark Attendance</h2>

        <form method="POST">

            <input type="text"
                   name="name"
                   placeholder="Student Name"
                   required>

            <input type="text"
                   name="roll_no"
                   placeholder="Roll Number"
                   required>

            <input type="date"
                   name="date"
                   required>

            <select name="status" required>
                <option value="">Select Attendance</option>
                <option value="Present">Present</option>
                <option value="Absent">Absent</option>
            </select>

            <button type="submit">
                Mark Attendance
            </button>

        </form>
    </div>

    <div class="card">
        <h2>📋 Attendance Records</h2>

        {% for student in students %}

        <div class="student">
            <strong>{{ student.name }}</strong><br>
            Roll No: {{ student.roll_no }}<br>
            Date: {{ student.date }}<br>
            Status: {{ student.status }}
        </div>

        {% else %}

        <p>No attendance records yet.</p>

        {% endfor %}

    </div>

</div>

</body>
</html>
