<!DOCTYPE html>

<head>

        }

            background: #1565c0;

            border: none;

            font-size: 16px;
        }

        @media (max-width: 600px) {
            th, td {
                padding: 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
