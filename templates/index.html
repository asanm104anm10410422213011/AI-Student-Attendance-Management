<!DOCTYPE html>
<html>
<head>
    <title>AI Student Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
        }

        .header {
            background: #1565c0;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 25px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #1565c0;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #1565c0;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📚 AI Student Attendance</h1>
        <p>Student Attendance Management System</p>
    </div>

    <div class="container">

        <div class="card">
            <h2>Student Details</h2>

            <input type="text" placeholder="Student Name">

            <input type="text" placeholder="Roll Number">

            <input type="date">

            <select>
                <option>Select Attendance</option>
                <option>Present</option>
                <option>Absent</option>
            </select>

            <button>Mark Attendance</button>
        </div>

        <div class="card">
            <h2>📊 Attendance</h2>

            <p>Attendance Percentage: <strong>0%</strong></p>
            <p>AI Prediction: <strong>Coming Soon</strong></p>
        </div>

    </div>

</body>
</html>
