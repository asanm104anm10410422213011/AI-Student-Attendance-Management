<!DOCTYPE html>
<html>
<head>
    <title>AI Student Attendance</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
        }

        .header {
            background: #1565c0;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 95%;
            max-width: 900px;
            margin: 25px auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            color: #1565c0;
        }

        input[type="date"] {
            padding: 10px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #e3f2fd;
        }

        input[type="radio"] {
            transform: scale(1.3);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>📚 AI Student Attendance</h1>
    <p>Daily Attendance Management</p>
</div>

<div class="container">

    <div class="card">

        <h2>📅 Mark Daily Attendance</h2>

        <form method="POST">

            <label><strong>Select Date:</strong></label><br>
            <input type="date" name="date" required>

            <table>

                <tr>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Present</th>
                    <th>Absent</th>
                </tr>

                {% for student in students %}
                <tr>
                    <td>{{ student.name }}</td>
                    <td>{{ student.roll_no }}</td>

                    <td>
                        <input type="radio"
                               name="{{ student.roll_no }}"
                               value="Present"
                               required>
                    </td>

                    <td>
                        <input type="radio"
                               name="{{ student.roll_no }}"
                               value="Absent">
                    </td>
                </tr>
                {% endfor %}

            </table>

            <button type="submit">✅ Save Attendance</button>

        </form>

    </div>

</div>

</body>
</html>
